[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "llm-agent-memory"
version = "0.1.0"
description = "Local Muse Glimmer evaluation on the pinned LLM-LIBERO protocol."
readme = "README.md"
requires-python = ">=3.11"
# inspect-robots, inspect-robots-agent and inspect-robots-libero come from the
# pinned submodules under vendor/ (scripts/00_setup_env.sh installs them).
# LIBERO itself (hf-libero) is installed by the same script.
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "anyio>=4.5",
    "httpx>=0.27",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
setup = ["huggingface-hub"]
drive = ["google-api-python-client", "google-auth-oauthlib", "google-auth-httplib2"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
